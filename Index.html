function doL(){let u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value.trim();let f=USERS.find(x=>x.u===u&&x.p===p); if(!f) return alert('Login incorrect'); CUR=f; save(); pushN('Connexion '+f.name); toast('Bienvenue '+f.name); appView();}
function doR(){let n=document.getElementById('rn').value.trim(),u=document.getElementById('ru').value.trim(),p=document.getElementById('rp').value.trim(),r=document.getElementById('rr').value; if(!n||!u||!p) return alert('Remplis tout'); if(USERS.find(x=>x.u===u)) return alert('Existe deja'); let nu={u,p,role:r,name:n}; USERS.push(nu); CUR=nu; save(); pushN('Nouveau compte '+n); toast('Compte cree'); appView();}
function appView(){let isSuper=CUR.role==='SUPER ADMIN'; let total=MAIN.reduce((s,r)=>s+(r.eff||0),0); let col=MAIN.filter(r=>r.eff>0).length; let myP=isSuper?PEND:PEND.filter(x=>x.user===CUR.u); let myPub=isSuper?PUBS:PUBS.filter(x=>x.author===CUR.u||x.shared); let rows=MAIN.map((r,i)=>`<tr><td>GRP${String(i+1).padStart(2,'0')}</td><td><b>${r.nom.substring(0,45)}</b><br><small>${r.resp}</small></td><td>${r.eff} F:${r.f} H:${r.h}</td><td><span class="badge ${r.eff>0?'badge-green':'badge-red'}">${r.eff>0?'✅':'🔴'}</span></td><td>${r.lat},${r.lon}</td></tr>`).join(''); let opts=OFFICIAL.map(n=>`<option>${n}</option>`).join(''); let pubs=myPub.slice(0,15).map(p=>`<div class="card" style="border-left:4px solid #2F5496"><div style="display:flex;gap:6px"><img src="data:image/jpeg;base64,${LOGO_B64}" style="width:26px;height:26px;border-radius:50%"><b style="font-size:12px">${p.authorName}</b><small>${p.time}</small></div><p style="font-size:12px">${p.text}</p>${p.img?`<img src="${p.img}" style="width:100%;max-height:300px;object-fit:contain;border-radius:12px">`:''}${p.video?`<video src="${p.video}" controls style="width:100%;border-radius:12px"></video>`:''}</div>`).join(''); let notifs=NOTIFS.slice(0,20).map(n=>`<div style="padding:6px;border-bottom:1px solid #eee;font-size:11px">${n.text}<br><small>${n.time}</small></div>`).join(''); document.getElementById('app').innerHTML=`<div class="header"><img src="data:image/jpeg;base64,${LOGO_B64}" class="logoRond"><div style="flex:1"><h1 style="margin:0;font-size:14px">AP2MD v7.3 ULTIME - ${CUR.name} - ${CUR.role}</h1><p style="margin:0;font-size:10px">13 officiels - 707 membres - 120 fonct - Logo + Pecheur - Offline liste officielle - Sans </p></div><button class="btn" style="background:#fff;color:#2F5496" onclick="toggleN()">🔔 ${NOTIFS.filter(n=>!n.read).length}</button><button class="btn" style="background:#1E3A6B;color:#fff;margin-left:6px" onclick="logout()">X</button></div><div style="max-width:1280px;margin:0 auto;padding:10px"><div class="card" style="padding:0;overflow:hidden"><img src="data:image/webp;base64,${FISH1_B64}" class="heroFish"><div style="margin-top:-32px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7));color:#fff;padding:10px;display:flex;gap:8px;align-items:center"><img src="data:image/jpeg;base64,${LOGO_B64}" style="width:40px;height:40px;border-radius:50%;border:2px solid #fff"><div><b>Logo officiel rond UN POUR TOUS</b><div style="font-size:11px">Meme homme meme habit centrafricain - Tilapia + Epervier</div></div></div></div><div class="grid grid4"><div class="card kpi"><b>${col}/13</b><span>Collectes</span></div><div class="card kpi"><b>${total}</b><span>Membres</span></div><div class="card kpi"><b>${myP.length}</b><span>Mes dossiers</span></div><div class="card kpi"><b>${PUBS.length}</b><span>Publications</span></div></div><div class="grid" style="grid-template-columns:2fr 1fr"><div><div class="card"><h3>📋 13 Noms Officiels - Liste gardee - Saisie offline</h3><div style="overflow:auto;max-height:340px"><table><thead><tr><th>ID</th><th>Nom + Resp</th><th>Eff</th><th>Statut</th><th>GPS</th></tr></thead><tbody>${rows}</tbody></table></div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-green" onclick="expCSV()">CSV</button><button class="btn btn-green" onclick="expJSON()">JSON</button><button class="btn btn-amber" onclick="backup()">Backup</button></div></div><div class="card"><h3>📸 Publier depuis galerie telephone - Notif auto</h3><textarea id="pt" placeholder="Terrain..." style="width:100%;min-height:60px;border-radius:10px;border:1px solid #D0D9EE;padding:8px"></textarea><div style="display:flex;gap:6px;margin-top:6px"><input type="file" id="gi" accept="image/*,video/*" style="display:none" onchange="prev(this)"><button class="btn" style="background:#EEF3FF;color:#2F5496;border:1px solid #C9D9FF" onclick="document.getElementById('gi').click()">Galerie</button><button class="btn btn-blue" onclick="pub()">Publier + Notif</button></div><div id="pv"></div></div><div class="card"><h3>Fil publications - Toutes notifs 🔔</h3>${pubs||'Aucune'}</div></div><div><div class="card"><h3>📱 Saisie Offline - Liste officielle 13</h3><select id="sel" class="input"><option>Choisir nom officiel</option>${opts}</select><input id="ef" type="number" placeholder="Femmes" class="input" style="margin-top:6px"><input id="eh" type="number" placeholder="Hommes" class="input" style="margin-top:6px"><input id="rs" placeholder="Responsable" class="input" style="margin-top:6px"><div style="display:flex;gap:6px;margin-top:6px"><input id="gp" placeholder="GPS" class="input" style="flex:1"><button class="btn btn-blue" onclick="getG()">GPS</button></div><textarea id="ob" placeholder="Obs" class="input" style="margin-top:6px"></textarea><button class="btn btn-blue" style="width:100%;margin-top:8px" onclick="saveT()">Enregistrer Offline → Dossier prive</button><div style="font-size:10px;margin-top:6px">${isSuper?'SUPER ADMIN voit TOUS dossiers':'Tu vois seulement TES dossiers'} - ${myP.length}</div></div><div class="card"><h3>📦 Mes dossiers prives - ${CUR.u}</h3><div style="max-height:260px;overflow:auto;font-size:11px">${myP.map(p=>`<div style="border:1px solid #EEF3FF;padding:6px;border-radius:8px;margin-bottom:6px"><b>${p.nom_officiel}</b><br>F:${p.f} H:${p.h}<br><small>${p.date}</small></div>`).join('')||'Aucun'}</div></div><div class="card" id="nbox" style="display:none"><h3>🔔 Notifications - Toutes pubs</h3><div style="max-height:260px;overflow:auto">${notifs}</div><button class="btn" style="width:100%;margin-top:6px;background:#EEF3FF" onclick="markR()">Tout lu</button></div><div class="card"><h3>120 fonctionnalites</h3><div style="font-size:10px">✅ 13 officiels ✅ KPI ✅ Offline liste ✅ GPS ✅ Galerie photo/video ✅ Notifs auto ✅ Comptes perso ✅ Super Admin seul maitre ✅ Logo rond + Pecheur ✅ 0 trace</div></div></div></div><div class="card" style="text-align:center;font-size:10px">© 2026 AP2MD DOUKE - Koyakela Reginald - v7.3 ULTIME - Logo + Pecheur centrafricain - 13 officiels - 707 - 120 fonct - 100% AP2MD pur</div></div>`;}
function toggleN(){let b=document.getElementById('nbox'); b.style.display=b.style.display==='none'?'block':'none'; NOTIFS.forEach(n=>n.read=true); save();}
function markR(){NOTIFS.forEach(n=>n.read=true); save(); appView();}
let prevD=null,prevT=null;function prev(inp){let f=inp.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{prevD=e.target.result; prevT=f.type.startsWith('video')?'video':'image'; document.getElementById('pv').innerHTML=prevT==='image'?`<img src="${prevD}" style="width:100%;max-height:200px;object-fit:contain;border-radius:12px">`:`<video src="${prevD}" controls style="width:100%"></video>`;}; r.readAsDataURL(f);}
function pub(){let t=document.getElementById('pt').value.trim(); if(!t&&!prevD) return alert('Texte ou photo'); let p={id:Date.now(),author:CUR.u,authorName:CUR.name,role:CUR.role,text:t,img:prevT==='image'?prevD:null,video:prevT==='video'?prevD:null,time:new Date().toLocaleString('fr-FR'),shared:true}; PUBS.unshift(p); save(); pushN('📸 Pub '+CUR.name+': '+t.substring(0,40)); toast('Publie + Notif'); document.getElementById('pt').value='';document.getElementById('pv').innerHTML='';prevD=null; appView();}
function getG(){if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{document.getElementById('gp').value=p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);});}
function saveT(){let sel=document.getElementById('sel').value,ff=document.getElementById('ef').value,hh=document.getElementById('eh').value,rs=document.getElementById('rs').value,gp=document.getElementById('gp').value,ob=document.getElementById('ob').value; if(sel==='Choisir nom officiel') return alert('Choisis nom'); let parts=gp.split(','); let la=parseFloat(parts[0]||0), lo=parseFloat(parts[1]||0); PEND.push({nom_officiel:sel,f:ff,h:hh,responsable:rs,lat:la,lon:lo,obs:ob,date:new Date().toISOString(),user:CUR.u}); save(); pushN('📝 Saisie '+sel+' par '+CUR.name); toast('Enregistre offline'); appView();}
function expCSV(){let csv='ID,Nom,Eff\n'; MAIN.forEach((r,i)=>{csv+=`GRP${i+1},${r.nom},${r.eff}\n`;}); let b=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='AP2MD.csv'; a.click();}
function expJSON(){let b=new Blob([JSON.stringify(MAIN,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='AP2MD.json'; a.click();}
function backup(){let b=new Blob([JSON.stringify({main:MAIN,pending:PEND})],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='AP2MD.ap2md'; a.click();}
function logout(){CUR=null; save(); loginView();}
if(CUR) appView(); else loginView();
</script>
</body>
</html>
