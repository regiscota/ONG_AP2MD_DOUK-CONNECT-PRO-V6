<style>
body{margin:0;font-family:system-ui;background:#F5F7FB}
.header{background:linear-gradient(135deg,#2F5496,#009EDB);color:#fff;padding:10px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:50}
.logoRond{width:62px;height:62px;border-radius:50%;background:#fff;padding:3px}
.card{background:#fff;border-radius:16px;padding:12px;margin:10px 0;border:1px solid #E6EFFF}
.btn{border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn-blue{background:#2F5496;color:#fff}
.kpi{text-align:center}
.kpi b{display:block;font-size:24px;color:#2F5496}
.grid{display:grid;gap:10px}
.grid4{grid-template-columns:repeat(4,1fr)}
.carousel{position:relative;overflow:hidden;border-radius:16px;height:320px;background:#000}
.carousel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
.carousel img.active{opacity:1}
.carousel .cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;padding:12px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);display:inline-block;margin:0 4px}
.dot.active{background:#fff}
.input{width:100%;padding:10px;border-radius:10px;border:1px solid #D0D9EE}
</style>

function animateCount(id,target){let el=document.getElementById(id); if(!el) return; let cur=0; let step=Math.ceil(target/50); let int=setInterval(()=>{cur+=step; if(cur>=target){cur=target; clearInterval(int);} el.textContent=cur.toLocaleString();},30);}

let prevD=null,prevT=null;function prev(inp){let f=inp.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{prevD=e.target.result; prevT=f.type.startsWith('video')?'video':'image'; document.getElementById('pv').innerHTML=prevT==='image'?`<img src="${prevD}" style="width:100%;max-height:200px">`:`<video src="${prevD}" controls style="width:100%"></video>`;}; r.readAsDataURL(f);}
function pub(){let t=document.getElementById('pt').value.trim(); if(!t&&!prevD) return alert('Texte ou photo'); PUBS.unshift({id:Date.now(),author:CUR.u,authorName:CUR.name,text:t,img:prevT==='image'?prevD:null,video:prevT==='video'?prevD:null,time:new Date().toLocaleString()}); save(); toast('Publié + Notif à tous'); appView();}
function saveT(){let sel=document.getElementById('sel').value; if(!sel) return alert('Choisis nom réel'); let data=REAL.find(r=>r.id==sel); PEND.push({nom_officiel:data.nom,f:data.femmes,h:data.hommes,date:new Date().toISOString(),user:CUR.u}); save(); toast('Enregistré offline - Auto écrase'); appView();}
